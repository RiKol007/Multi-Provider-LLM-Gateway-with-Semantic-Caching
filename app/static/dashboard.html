<!DOCTYPE html>
<html>
<head>
    <title>LLM Gateway Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f1117; color: #e4e4e7; padding: 40px; }
        h1 { font-size: 24px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1a1d27; border-radius: 12px; padding: 20px; border: 1px solid #2a2d3a; }
        .card .label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        .card .value { font-size: 28px; font-weight: 600; }
        .section { background: #1a1d27; border-radius: 12px; padding: 20px; border: 1px solid #2a2d3a; margin-bottom: 20px; }
        .section h2 { font-size: 16px; margin-bottom: 15px; color: #9ca3af; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2d3a; }
        .refresh-note { color: #6b7280; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🚀 LLM Inference Gateway — Live Dashboard</h1>
    <div class="grid" id="cards"></div>
    <div class="section">
        <h2>Requests by Provider</h2>
        <div id="providers"></div>
    </div>
    <div class="section">
        <h2>Cost by User</h2>
        <div id="users"></div>
    </div>
    <p class="refresh-note">Auto-refreshes every 5 seconds</p>

    <script>
        async function loadData() {
            const res = await fetch('/dashboard/data');
            const data = await res.json();

            document.getElementById('cards').innerHTML = `
                <div class="card"><div class="label">Total Requests</div><div class="value">${data.total_requests}</div></div>
                <div class="card"><div class="label">Total Cost (USD)</div><div class="value">$${data.total_cost_usd}</div></div>
                <div class="card"><div class="label">Cache Hit Rate</div><div class="value">${data.cache_hit_rate_percent}%</div></div>
                <div class="card"><div class="label">Cache Hits / Misses</div><div class="value">${data.cache_hits} / ${data.cache_misses}</div></div>
            `;

            document.getElementById('providers').innerHTML = Object.entries(data.provider_counts)
                .map(([k, v]) => `<div class="row"><span>${k}</span><span>${v} requests</span></div>`).join('');

            document.getElementById('users').innerHTML = Object.entries(data.user_costs)
                .map(([k, v]) => `<div class="row"><span>${k}</span><span>$${v}</span></div>`).join('');
        }

        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
